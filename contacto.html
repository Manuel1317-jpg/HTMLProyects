<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>
    </head>
    <body>
      
        <header></header>

        <nav>
            <a href="index.html">Volver a mi pagina</a>
        </nav>
        

        <main>
            <section>
                <h2>Enviame un mensaje</h2>


                 <form>
                    <ul>
                        <li><label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu Nombre">
                        </li>

                        <li><label for="correo">Correo electronico:</label>
                            <input type="email" id="correo" name="correo " placeholder="Escribe tu correo">
                        </li>

                        <li><label for="edad">Edad:</label>
                            <input type="number" id="edad" name="edad" placeholder="Edad">
                        </li>

                        <li> <label for="mensaje">Mensaje:</label>
                            <textarea name="mensaje" id="mensaje" placeholder="mensaje"></textarea>
                        </li>

                        <li>
                            <button>Enviar</button>
                        </li>
                    </ul>

                 </form>
            </section>

            <section>
                <h2>Hola mundo</h2>
            </section>
        </main>

        <footer></footer>
    </body>
</html>
